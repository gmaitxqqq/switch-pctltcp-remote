# switch-pctltcp-remote — Server deployment
#
# Deploy on 飞牛OS (or any Docker host) with:
#   cd server && docker compose up -d
#
# IMPORTANT: Change the PSK values before deploying!
# The container binds 127.0.0.1 only — external access MUST go through
# 雷池 WAF (or your preferred reverse proxy with TLS termination).

services:
  switch-ctrl:
    build: .
    container_name: switch-ctrl
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"   # Only localhost! Use 雷池 WAF as reverse proxy.
    environment:
      # ┌──────────────────────────────────────────────────────────────┐
      # │  CHANGE THESE!  Generate your own random strings.          │
      # │  The PSK_SWITCH must match the TUNNEL_PSK in heartbeat_client.h │
      # └──────────────────────────────────────────────────────────────┘
      - PSK_SWITCH=sw-change-me-to-a-long-random-string
      - PSK_ADMIN=adm-change-me-to-another-random-string
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
