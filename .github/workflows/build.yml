name: Build Switch NSP

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Makefile'
      - 'pctltcp-sysmodule.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with devkitPro Docker
        run: |
          # Create container without mounting workspace
          docker create --name switch-build devkitpro/devkita64:latest             bash -c "export DEVKITPRO=/opt/devkitpro &&                      dkp-pacman -Syu --noconfirm &&                      dkp-pacman -S --noconfirm switch-dev &&                      cd /home/build &&                      make"

          # Copy source into container
          docker cp Makefile switch-build:/home/build/
          docker cp pctltcp-sysmodule.json switch-build:/home/build/
          docker cp source switch-build:/home/build/

          # Start build
          docker start -a switch-build

          # Copy artifacts out
          docker cp switch-build:/home/build/pctltcp-sysmodule.nsp . || true
          docker cp switch-build:/home/build/pctltcp-sysmodule.nso . || true

          # Cleanup
          docker rm switch-build

      - name: Upload NSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule
          path: pctltcp-sysmodule.nsp
          if-no-files-found: error

      - name: Upload NSO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule-nso
          path: pctltcp-sysmodule.nso
          if-no-files-found: warn
