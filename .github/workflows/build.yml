name: Build Switch NSP

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Makefile'
      - 'pctltcp-sysmodule.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with devkitPro Docker
        run: |
          # Start container in background
          docker run -d --name switch-build devkitpro/devkita64:latest sleep 3600

          # Install switch-dev (includes libnx)
          docker exec switch-build bash -c "source /etc/profile.d/devkit-env.sh &&             dkp-pacman -S --noconfirm switch-dev"

          # Create build dir and copy source
          docker exec switch-build mkdir -p /tmp/build
          docker cp source switch-build:/tmp/build/source
          docker cp Makefile switch-build:/tmp/build/Makefile
          docker cp pctltcp-sysmodule.json switch-build:/tmp/build/pctltcp-sysmodule.json

          # Build
          docker exec -w /tmp/build switch-build bash -c "source /etc/profile.d/devkit-env.sh && make"

          # Copy artifacts out
          docker cp switch-build:/tmp/build/pctltcp-sysmodule.nsp . || true
          docker cp switch-build:/tmp/build/pctltcp-sysmodule.nso . || true

          # Cleanup
          docker rm -f switch-build

      - name: Upload NSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule
          path: pctltcp-sysmodule.nsp
          if-no-files-found: error

      - name: Upload NSO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule-nso
          path: pctltcp-sysmodule.nso
          if-no-files-found: warn
