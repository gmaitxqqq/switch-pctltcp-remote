name: Build Switch NSP

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Makefile'
      - 'pctltcp-sysmodule.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with devkitPro Docker
        run: |
          # Start a container in background with a long sleep
          docker run -d --name switch-build devkitpro/devkita64:latest sleep 3600

          # Copy source directory first (docker cp dir auto-creates target)
          docker cp source switch-build:/tmp/build-source/

          # Copy individual files
          docker cp Makefile switch-build:/tmp/build-source/
          docker cp pctltcp-sysmodule.json switch-build:/tmp/build-source/

          # Run the build inside the running container
          docker exec switch-build bash -c "export DEVKITPRO=/opt/devkitpro &&             dkp-pacman -Syu --noconfirm &&             dkp-pacman -S --noconfirm switch-dev &&             cd /tmp/build-source &&             make"

          # Copy artifacts out
          docker cp switch-build:/tmp/build-source/pctltcp-sysmodule.nsp . || true
          docker cp switch-build:/tmp/build-source/pctltcp-sysmodule.nso . || true

          # Cleanup
          docker rm -f switch-build

      - name: Upload NSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule
          path: pctltcp-sysmodule.nsp
          if-no-files-found: error

      - name: Upload NSO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule-nso
          path: pctltcp-sysmodule.nso
          if-no-files-found: warn
