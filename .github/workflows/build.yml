name: Build Switch NSP

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Makefile'
      - 'pctltcp-sysmodule.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with devkitPro Docker
        run: |
          # Start container in background
          docker run -d --name switch-build devkitpro/devkita64:latest sleep 3600

          # Install devkitPro packages
          docker exec switch-build bash -c "export DEVKITPRO=/opt/devkitpro &&             dkp-pacman -Syu --noconfirm &&             dkp-pacman -S --noconfirm switch-dev"

          # Copy source into container via tar pipe
          tar cf - Makefile pctltcp-sysmodule.json source |             docker exec -i switch-build tar xf - -C /tmp/build

          # Build
          docker exec -w /tmp/build switch-build make DEVKITPRO=/opt/devkitpro

          # Copy artifacts out
          docker cp switch-build:/tmp/build/pctltcp-sysmodule.nsp . || true
          docker cp switch-build:/tmp/build/pctltcp-sysmodule.nso . || true

          # Cleanup
          docker rm -f switch-build

      - name: Upload NSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule
          path: pctltcp-sysmodule.nsp
          if-no-files-found: error

      - name: Upload NSO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule-nso
          path: pctltcp-sysmodule.nso
          if-no-files-found: warn
