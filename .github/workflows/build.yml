name: Build Switch NSP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug environment
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "PATH=$PATH"
          which aarch64-none-elf-gcc && aarch64-none-elf-gcc --version | head1 || echo "No aarch64 gcc"
          which gcc && gcc --version | head -1 || echo "No host gcc"
          ls $DEVKITPRO/devkitA64/bin/ | head -5

      - name: Build
        run: |
          make clean || true
          make 2>&1 | tee build.log

      - name: Prepare release artifact
        run: |
          TID="010000000000BD23"
          DIST="dist/atmosphere/contents/${TID}"
          FLAGS="dist/atmosphere/contents/${TID}/flags"

          mkdir -p "${DIST}" "${FLAGS}"

          if [ -f "pctltcp-sysmodule.nsp" ]; then
            cp "pctltcp-sysmodule.nsp" "${DIST}/exefs.nsp"
            echo "NSP: OK"
          else
            echo "ERROR: pctltcp-sysmodule.nsp not found!"
            ls -la *.nsp *.nso *.npdm *.elf 2>/dev/null || true
            exit 1
          fi

          if [ -f "toolbox.json" ]; then
            cp "toolbox.json" "${DIST}/toolbox.json"
            echo "toolbox.json: OK"
          fi

          touch "${FLAGS}/boot2.flag"

          echo "--- Release contents ---"
          find dist/ -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule
          path: dist/

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
