name: Build Switch NSP

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Makefile'
      - 'pctltcp-sysmodule.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with devkitPro Docker
        run: |
          # Package source into a tarball
          tar czf source.tar.gz Makefile pctltcp-sysmodule.json source

          # Run build inside container, passing tarball via stdin
          docker run --rm -i devkitpro/devkita64:latest bash -c "             export DEVKITPRO=/opt/devkitpro &&             dkp-pacman -Syu --noconfirm &&             dkp-pacman -S --noconfirm switch-dev &&             mkdir -p /tmp/build &&             cd /tmp/build &&             tar xzf - &&             make" < source.tar.gz

      - name: Upload NSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule
          path: pctltcp-sysmodule.nsp
          if-no-files-found: error

      - name: Upload NSO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule-nso
          path: pctltcp-sysmodule.nso
          if-no-files-found: warn
