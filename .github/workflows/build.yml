name: Build Switch NSP

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Makefile'
      - 'pctltcp-sysmodule.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devkitPro
        run: |
          # Add devkitPro apt repository
          sudo apt-get update
          sudo apt-get install -y wget gpg
          wget -q https://apt.devkitpro.org/devkitpro-pacman.gpg -O /tmp/devkitpro-pacman.gpg
          sudo gpg --dearmor -o /usr/share/keyrings/devkitpro-pacman.gpg /tmp/devkitpro-pacman.gpg
          echo "deb [signed-by=/usr/share/keyrings/devkitpro-pacman.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo apt-get install -y switch-dev

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          make clean
          make

      - name: Upload NSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule
          path: pctltcp-sysmodule.nsp
          if-no-files-found: error

      - name: Upload NSO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-sysmodule-nso
          path: pctltcp-sysmodule.nso
          if-no-files-found: warn
